[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-self-healing"
version = "0.1.0"
description = "Autonomous Fault Detection and Self-Healing System for Linux"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Self-Healing Research Team" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "psutil>=7.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
ml = [
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "pandas>=2.2.0",
]

[project.scripts]
self-healing = "self_healing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Tests with longer duration",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
